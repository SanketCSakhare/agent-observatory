[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observatory"
version = "1.0.0"
description = "Reproducible AI agent telemetry analytics with SQLite and an offline dashboard"
requires-python = ">=3.10"
authors = [{name = "Sanket Sakhare"}]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
